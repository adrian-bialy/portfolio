      - { id: qlikview, name: QlikView, emoji: "📗", icon: "assets/logos/qlik.svg" }
      - { id: sapbo, name: SAP BusinessObjects, emoji: "🧩", icon: "assets/logos/sap.svg" }

  - name: Databases & Warehouses
