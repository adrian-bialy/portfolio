# ── Tech stack ───────────────────────────────────────────────────
# Categories render as filter pills; each skill is a chip.
# `id` is referenced from projects.yaml (tech: [...]) — keep ids stable.
# `icon` is a real vendor logo (local assets/logos/... path, or URL);
# `emoji` is shown as a fallback if the icon is missing/fails to load,
# and as a decorative accent. Logos are self-hosted SVGs under
# assets/logos/ (sourced from Simple Icons / vendor marks). SQL, DAX,
# VBA, SSIS, Vertica and MS SQL Server have no freely-licensed vendor
# logo, so they keep their emoji.

categories:
  - name: Languages
    emoji: "💬"
    skills:
      - { id: sql, name: SQL / T-SQL, emoji: "🧮" }
      - { id: python, name: Python, emoji: "🐍", icon: "assets/logos/python.svg" }
      - { id: dax, name: DAX, emoji: "📐" }
      - { id: bash, name: Bash, emoji: "🐚", icon: "assets/logos/gnubash.svg" }
      - { id: vba, name: VBA, emoji: "📎" }

  - name: Data Engineering & ETL
    emoji: "🔄"
    skills:
      - { id: databricks, name: Databricks, emoji: "🧱", icon: "assets/logos/databricks.svg" }
      - { id: spark, name: PySpark, emoji: "⚡", icon: "assets/logos/apachespark.svg" }
      - { id: dbt, name: dbt, emoji: "🔶", icon: "assets/logos/dbt.svg" }
      - { id: airflow, name: Apache Airflow, emoji: "🌬️", icon: "assets/logos/apacheairflow.svg" }
      - { id: ssis, name: SSIS, emoji: "🔀" }
